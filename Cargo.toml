[package]
name = "crexe"
version = "1.0.0"
edition = "2021"
description = "CREXE v1 Rust executor - Creative Executable runtime"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/omarceloribeiro/crexe"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
fs2 = "0.4"
ctrlc = "3"
toml = "0.8"
dotenvy = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
