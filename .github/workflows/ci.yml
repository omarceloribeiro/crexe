name: Rust checks
on:
  push:
    branches: [main, feature/v1]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.1 fmt --all --check
      - name: Lint
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Tests (local provider only)
        run: cargo +1.98.1 test --locked
      - name: Windows native SDK (CI runner only)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose native compiler to the Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Join-Path $env:MSYS2_LOCATION 'ucrt64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Linux native SDK (CI runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make pkg-config libgtk-3-dev
      - name: Native project fixture (no real model or GUI interaction)
        run: cargo +1.98.1 test --locked --test native_profiles -- --ignored --nocapture
      - name: Release build
        run: cargo +1.98.1 build --release --locked
      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $crexeVswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $crexeDumpbin = & $crexeVswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (-not $crexeDumpbin) { throw 'dumpbin not found' }
          $crexeImports = & $crexeDumpbin /DEPENDENTS target/release/crexe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect PE imports' }
          $crexeImports | Select-String -Pattern '\.dll'
          if ($crexeImports -match 'VCRUNTIME|MSVCP\d+\.dll') { throw 'Engine still depends on VC++ redistributable DLLs' }
      - name: Prepare and verify development snapshot (no release publication)
        run: python scripts/package-engine.py
      - name: Keep development package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: crexe-development-${{ matrix.os }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 14
