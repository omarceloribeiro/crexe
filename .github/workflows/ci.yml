name: Rust checks
on:
  push:
    branches: [main, feature/v1]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.1 fmt --all --check
      - name: Lint
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Tests (local provider only)
        run: cargo +1.98.1 test --locked
      - name: Windows native SDK (CI runner only)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose native compiler to the Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Join-Path $env:MSYS2_LOCATION 'ucrt64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Linux native SDK (CI runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make pkg-config libgtk-3-dev
      - name: Native project fixture (no real model or GUI interaction)
        run: cargo +1.98.1 test --locked --test native_profiles -- --ignored --nocapture
      - name: Release build
        run: cargo +1.98.1 build --release --locked
